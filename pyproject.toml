[project]
name = "gromacs-gui"
version = "4.3.0"
description = "GROMACS-GUI Molecular Dynamics Simulation & Analysis Integrated Workbench"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["source", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
